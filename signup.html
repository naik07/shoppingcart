<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Registration – LUXORA</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

  <!-- Ambient Luminous Mesh Background -->
  <div class="bg-mesh-container">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>
  <div class="bg-grid-overlay"></div>

  <!-- Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-spark"></span> LUXORA
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-glass btn-sm">Already a Member? Sign In</a>
      </div>
    </div>
  </header>

  <!-- Signup Form Container -->
  <main style="min-height: calc(85vh - var(--nav-height)); display:flex; align-items:center; justify-content:center; padding: 40px 20px;">
    <div style="width:100%; max-width:620px; background:var(--bg-card); backdrop-filter:var(--backdrop-blur); border:var(--border-glass-bright); border-radius:var(--radius-lg); padding:40px; box-shadow:var(--shadow-glass), 0 0 40px rgba(168,85,247,0.25);">
      
      <div style="text-align:center; margin-bottom:30px;">
        <span class="section-tag" style="margin-bottom:10px;">BESPOKE MEMBERSHIP</span>
        <h1 style="font-size:1.9rem; margin-bottom:8px;">Begin Your Journey</h1>
        <p style="color:var(--text-secondary); font-size:0.92rem;">Register your account to unlock private concierge tiers and 250 welcome loyalty points.</p>
      </div>

      <form id="signupForm">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label" for="signupName">Full Legal Name</label>
            <input type="text" id="signupName" class="form-input" placeholder="e.g. Elena Rostova" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="e.g. elena@luxora.com" required>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label" for="signupPhone">Mobile Number</label>
            <input type="tel" id="signupPhone" class="form-input" placeholder="+91 98765 43210" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupRole">Account Hierarchy (OOPS Model)</label>
            <select id="signupRole" class="form-select">
              <option value="CUSTOMER">Customer (Shopper VIP)</option>
              <option value="ADMIN">Executive Admin (Store Manager)</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label" for="signupPassword">Create Password</label>
            <input type="password" id="signupPassword" class="form-input" placeholder="Min. 6 characters" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
            <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Repeat password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupAddress">Delivery / Residence Address</label>
          <input type="text" id="signupAddress" class="form-input" placeholder="e.g. Villa 12, Palm Meadows Estates" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label" for="signupCity">City</label>
            <input type="text" id="signupCity" class="form-input" value="Bangalore" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupState">State</label>
            <input type="text" id="signupState" class="form-input" value="Karnataka" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupPincode">PIN Code</label>
            <input type="text" id="signupPincode" class="form-input" value="560066" required>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:8px; margin-bottom:24px; font-size:0.85rem; color:var(--text-secondary);">
          <input type="checkbox" id="termsCheck" required checked style="accent-color:var(--accent-purple);">
          <label for="termsCheck">I agree to the Luxora Concierge Terms of Service & Privacy Policy</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          Complete Registration & Claim VIP Access →
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; padding-top:18px; border-top:var(--border-glass); font-size:0.9rem; color:var(--text-secondary);">
        Already hold a Luxora account? 
        <a href="login.html" style="color:var(--accent-purple); font-weight:700; text-decoration:underline;">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
